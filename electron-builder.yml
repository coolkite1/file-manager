# electron-builder 打包配置：npm run dist 一条命令生成安装包 + 便携版 exe
appId: cn.vibeguide.fileorganizer
productName: 文件整理助手
directories:
  output: release
files:
  - src/**/*
  - package.json
asar: true
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: 文件整理助手
  artifactName: FileOrganizer-Setup-${version}-${arch}.${ext}
portable:
  artifactName: FileOrganizer-Portable-${version}-${arch}.${ext}
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
